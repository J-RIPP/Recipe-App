name: Build Android APK

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Build web app
        run: npm run build

      - name: Sync into Android project
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --warning-mode=none 2>&1 | tee ../gradle.log
          cp app/build/outputs/apk/release/app-release.apk ../OurRecipes.apk

      - name: Share build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch gradle.log
          { echo '```'; grep -n -i -E "error|wrong|failed|exception|what went wrong" -A3 gradle.log | head -150; echo '```'; echo; echo '```'; tail -60 gradle.log; echo '```'; } > notes.md
          gh release create "ci-log-${BUILD_NUMBER}" --prerelease --title "CI log ${BUILD_NUMBER}" --notes-file notes.md --target "${GITHUB_SHA}"

      - uses: actions/upload-artifact@v4
        with:
          name: OurRecipes-apk
          path: OurRecipes.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.${BUILD_NUMBER}"
          gh release create "$TAG" OurRecipes.apk \
            --target "${GITHUB_SHA}" \
            --title "Our Recipes ${TAG}" \
            --notes "Download **OurRecipes.apk** on your phone and open it to install or update. Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}." \
            --latest
